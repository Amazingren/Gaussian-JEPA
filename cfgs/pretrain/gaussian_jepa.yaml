optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.001,
  weight_decay : 0.05
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10
}}

dataset : {
  train : { _base_: cfgs/dataset_configs/ShapeNet55GS.yaml,
            others: {subset: 'train', norm_attribute: ['xyz','opacity','scale','rotation','sh']}},
  val : { _base_: cfgs/dataset_configs/ShapeNet55GS.yaml,
            others: {subset: 'test', norm_attribute: ['xyz','opacity','scale','rotation','sh']}},
  test : { _base_: cfgs/dataset_configs/ShapeNet55GS.yaml,
            others: {subset: 'test', norm_attribute: ['xyz','opacity','scale','rotation','sh']}},
}

model : {
  NAME: GaussianJEPA,
  # Four non-overlapping targets cover 32 of the 64 Gaussian tokens.
  num_targets: 4,
  target_sizes: [11, 9, 7, 5],
  group_size: 32,
  num_group: 64,
  attribute: ['xyz','opacity','scale','rotation','sh'],
  group_attribute: ['xyz'],
  soft_knn: false,

  lambda_ground: 0.1,
  num_swd_projections: 256,

  transformer_config: {
    mask_ratio: 0.55,           # compatibility field; target_sizes set the 50% mask
    mask_type: 'block',
    trans_dim: 384,
    encoder_dims: 384,
    depth: 12,
    drop_path_rate: 0.1,
    num_heads: 6,
    decoder_depth: 4,
    decoder_num_heads: 6,
    pred_dim: 192,
  },
}

ema_momentum_start: 0.996
ema_momentum_end: 0.9999

npoints: 1024
npoints_fps: false
total_bs : 256
step_per_update : 1
max_epoch : 300
loss_display_scale: 1
