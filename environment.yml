name: gaussian_jepa
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.8
  - cuda-nvcc=11.8
  - numpy=1.26
  - scipy
  - scikit-learn
  - pyyaml
  - h5py
  - matplotlib
  - pandas
  - pillow
  - tqdm
  - ninja
  - pip
  - pip:
      - easydict
      - opencv-python-headless
      - plyfile
      - tensorboardX
      - termcolor
      - timm==0.9.16
      - wandb
      - git+https://github.com/unique1i/pointnet2_pytorch.git#egg=pointnet2_ops&subdirectory=pointnet2_ops_lib
      - git+https://github.com/unique1i/knn_cuda.git#egg=KNN_CUDA
